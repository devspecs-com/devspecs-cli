name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEVSPECS_TELEMETRY: '0'
      DEVSPECS_TEST_TIMEOUT: '30m'
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated DevSpecs home
        shell: bash
        run: echo "DEVSPECS_HOME=$RUNNER_TEMP/devspecs-test-home" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: staticcheck ./...

      - name: Gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Test assertion policy
        run: go run ./scripts/ci/check-test-assertions

      - name: Unit tests
        run: go test -v -race -count=1 -timeout "$DEVSPECS_TEST_TIMEOUT" -coverprofile coverage.out ./...

      - name: Coverage floor (aggregate >=80%)
        env:
          COVERAGE_FLOOR: '80.0'
        run: go run ./scripts/ci/check-coverage --profile coverage.out --floor "$COVERAGE_FLOOR"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out

  maintenance-platform:
    name: Doctor & index recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DEVSPECS_TELEMETRY: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated DevSpecs home
        shell: bash
        run: echo "DEVSPECS_HOME=$RUNNER_TEMP/devspecs-maintenance-home" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build installed CLI
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          go build -o "$RUNNER_TEMP/ds${suffix}" ./cmd/ds
          "$RUNNER_TEMP/ds${suffix}" --version

      - name: Test doctor and index recovery platform behavior
        run: go test ./internal/store ./internal/commands -run "^(TestInspectIndex|TestDoctorCommand|TestFindDoctorExecutableCandidates|TestSameDoctorExecutable|TestCreateIndexBackup|TestOpen_WithSupportedOlderSchema_PreservesVerifiedRollbackBackup|TestRestoreIndex|TestReplaceIndexWithStage|TestIndexBackupCommand|TestIndexRebuildCommand|TestScanRebuild)" -count=1

      - name: Test hub process delivery and store integrity
        run: go test ./internal/hubstore ./internal/commands -run "^(TestHubE2E|TestHubQuality|TestKilledWriter|TestKilledAfter|TestKilledDuringPrune|TestConcurrentArchiveAndSchemaRegistration|TestHubTopicList|TestListTopics|TestValidateTopicListRepo|TestPruneHub(Reconciles|Rejects|Preserves|Leaves|Recovers|Clears)|TestReservePruneBackupRejectsOccupiedPathWithoutDeletingUserFile|TestWritePruneIntentPreservesExistingMarkerOnPublishFailure|TestVacuumIntoAcceptsExclusivelyCreatedEmptyDestination|TestPruneRolloverKeepsOnlyLatestOwnedBackup)" -count=1

      - name: Test home-global hub scope
        run: go test ./internal/hubstore ./internal/commands -run "^(TestGlobal|TestConcurrentGlobal|TestEnrollGlobal|TestV6Migration|TestRepositoryTopicIsNotListedInGlobalScope|TestHub.*Global|TestOpenRejectsNewerFormat)" -count=1

      - name: Test cooperative hub leases and upgrade
        run: go test ./internal/hubstore ./internal/commands -run "^(TestAcquireLease|TestShowLease|TestRenewLease|TestReleaseLease|TestHubLease|TestOpenMigratesPopulatedV7HubToLeases)" -count=1

      - name: Test development-home isolation and launcher
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/devhome-isolation-tests"
          if [ "$RUNNER_OS" = "Windows" ]; then
            runtime_root="$(cygpath -m "$RUNNER_TEMP")/devhome-isolation-tests"
          fi
          mkdir -p "$runtime_root/home" "$runtime_root/temp" "$runtime_root/go-tmp"
          export DEVSPECS_HOME="$runtime_root/home"
          export DEVSPECS_TELEMETRY=0
          export GOMAXPROCS=2
          export GOTMPDIR="$runtime_root/go-tmp"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export TEMP="$runtime_root/temp"
            export TMP="$runtime_root/temp"
          fi
          go test -p 1 -parallel 1 -count=1 -timeout 5m ./scripts/internal/devhome ./scripts/dev-env

  headless-dispatch:
    name: Tagged headless dispatch conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOMAXPROCS: '2'
      DEVSPECS_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build tagged archive and precompiled test runner
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/headless-dispatch"
          mkdir -p "$proof"
          CGO_ENABLED=0 go build -p 1 -tags devspecs_http_loopback -o "$proof/ds" ./cmd/ds
          CGO_ENABLED=0 go test -p 1 -tags devspecs_http_loopback -c -o "$proof/orchestration.test" ./internal/orchestration
          tar -czf "$proof/ds-headless-linux.tar.gz" -C "$proof" ds
          cd "$proof"
          sha256sum ds-headless-linux.tar.gz | tee checksums.txt

      - name: Verify tagged archive without outbound network
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/headless-dispatch"
          sudo unshare --net -- env -i \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" \
            GOMAXPROCS=2 GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_LAZY_FETCH=1 \
            sh -eu -c '
              ip link set lo up
              test "$(ip -o link show | wc -l)" -eq 1
              test -z "$(ip -4 route show default)"
              test -z "$(ip -6 route show default)"
              exec sh "$4" "$1" "$2" "$3"
            ' sh "$proof/ds-headless-linux.tar.gz" "$proof/checksums.txt" \
              "$proof/orchestration.test" "$GITHUB_WORKSPACE/scripts/ci/verify-headless-dispatch.sh"

  release-package:
    name: Release package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build snapshot packages
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

      - name: Verify every release channel contains the ds binary
        shell: bash
        run: bash ./scripts/ci/verify-release-package.sh dist
