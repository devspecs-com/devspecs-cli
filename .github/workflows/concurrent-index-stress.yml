name: Concurrent Index Stress

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concurrent-index-stress
  cancel-in-progress: false

jobs:
  stress:
    name: Repeated shared-index contention
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEVSPECS_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated DevSpecs home
        shell: bash
        run: echo "DEVSPECS_HOME=$RUNNER_TEMP/devspecs-concurrency-home" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run repeated process-level contention gate
        run: >-
          go test -race ./cmd/ds
          -run '^(TestMain_WhenConcurrentCommandsShareIndex_SerializesWritesAndPreservesReads|TestMain_WhenCPUActiveMapRefreshIsTerminated_ReapsGitAndPreservesIndex)$'
          -count=10
          -timeout=25m
